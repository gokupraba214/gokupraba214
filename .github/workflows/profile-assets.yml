name: Update Profile Assets

# Builds every generated README asset in one job and publishes them together.
# The publish step force-replaces the `output` branch, so all assets must be
# produced by this single workflow or they will overwrite each other.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, devin/1793637308-profile-refresh]
    paths:
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7B2FF7&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00D9FF

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: "bg_color=0d1117&color=00d9ff&line=7b2ff7&point=f107a3&area=true&hide_border=true&radius=12"
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.12.0
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          UTC_OFFSET: 8
          AUTO_PUSH: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect summary cards
        run: |
          mkdir -p dist/summary
          cp profile-summary-card-output/github_dark/*.svg dist/summary/

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets [skip ci]"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
